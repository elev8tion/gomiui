{{define "partials/accents/row"}}
<li class="accent-preset">
  <form method="post" action="/accents/apply" hx-post="/accents/apply" hx-target="#accent-studio" hx-swap="outerHTML">
    <input type="hidden" name="accent" value="{{.Accent}}">
    <input type="hidden" name="strong" value="{{.Strong}}">
    <input type="hidden" name="ink" value="{{.Ink}}">
    <button class="accent-preset__apply {{if .Active}}is-active{{end}}" type="submit" aria-pressed="{{if .Active}}true{{else}}false{{end}}">
      <i style="--swatch: {{.Accent}}" aria-hidden="true"></i>
      <span>{{.Name}}</span>
    </button>
  </form>
  {{if not .Builtin}}
  <form method="post" action="/accents/{{.ID}}/delete" hx-post="/accents/{{.ID}}/delete" hx-target="#accent-studio" hx-swap="outerHTML" hx-confirm="Delete {{.Name}}?">
    <button class="accent-preset__delete" type="submit" aria-label="Delete {{.Name}}">×</button>
  </form>
  {{end}}
</li>
{{end}}
